<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Workshop Registration</title>

  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- External stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="form-container">
      <h1>Developer Workshop Registration</h1>

      <form id="registration-form" action="#" method="post">

        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full_name" placeholder="e.g. Ama Mensah" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="experience">Experience Level</label>
          <select id="experience" name="experience">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <fieldset class="form-group">
          <legend>Workshop Track</legend>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="track-frontend" name="track" value="frontend" checked>
              <label for="track-frontend">Frontend Web</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="track-backend" name="track" value="backend">
              <label for="track-backend">Backend APIs</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="track-design" name="track" value="design">
              <label for="track-design">UI/UX Design</label>
            </div>
          </div>
        </fieldset>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="updates" name="updates" value="yes">
          <label for="updates">I agree to receive event updates</label>
        </div>

        <button type="submit">Register Now</button>
      </form>
    </div>
  </main>
</body>
</html>
